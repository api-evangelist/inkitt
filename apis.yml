aid: inkitt
name: Inkitt
description: Inkitt is a data-driven storytelling and self-publishing technology company that runs a
  reading and writing community (inkitt.com) and the paid serialized-fiction reading app Galatea. It
  uses reader-engagement analytics and algorithms to discover promising manuscripts from independent
  authors and develop the most popular into commercial fiction and adaptations across its Inkitt and
  Galatea platforms. Founded in 2013 and backed by Earlybird, HV Capital, Khosla Ventures, Kleiner
  Perkins and Speedinvest, Inkitt operates consumer mobile and web reading products rather than a
  public developer API; this profile tracks its public web, domain-security, and GitHub surface.
